<!--
  O mesmo desenho, nas cores do Farejo.

  O arquivo original era uma forma só, toda preta: o traço e as manchas em um
  `path`, e o branco aparecendo por onde ele não passa. Para colorir sem
  redesenhar nada, o truque é usar o PRIMEIRO subcaminho — que é o contorno
  externo — como o corpo, preenchido de creme, e desenhar o traço original
  inteiro por cima. O creme aparece exatamente nos vazados, e a silhueta fica
  igualzinha.

  Cores: as mesmas dos outros mascotes (#fcfbf7 creme, #121110 preto, #ea879d
  rosa).
-->
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824.49 564.28">
  <defs>
    <style>
      .corpo { fill: #fcfbf7; }
      .traco { fill: #121110; }
    </style>
  </defs>
