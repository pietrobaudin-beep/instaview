<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" fill="none">
  <title>Cachorrinho com lupa e coleira rosa</title>
  <desc>Cachorrinho branco sentado, com cabeça grande, orelhas pretas caídas, patas arredondadas, coleira rosa e uma lupa diante do olho.</desc>
  <rect width="400" height="420" fill="#FCF6ED"/>
  <g stroke="#111110" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cauda atrás do corpo. -->
    <path d="M279 309C312 309 330 278 326 248C325 237 325 232 329 233C351 242 364 266 360 291C356 325 332 349 292 350L273 346Z" fill="#FFFDFA"/>
    <!-- Corpo e patas traseiras. -->
    <path d="M139 221C119 236 104 257 101 282C88 295 77 316 78 336C78 354 88 364 105 365C120 368 132 362 143 365C165 373 187 369 204 368C223 373 241 369 254 367C268 369 287 369 297 359C308 347 307 332 303 315C297 280 280 246 256 227C225 213 171 213 139 221Z" fill="#FFFDFA"/>
    <!-- Coleira delimitada pelo pescoço e pelo peito. -->
    <path d="M139 217C165 227 220 230 250 220L257 238C224 253 168 250 131 235Z" fill="#EF91AE"/>
    <!-- Cabeça grande, com bochechas suaves. -->
    <path d="M97 104C99 72 122 52 155 47C188 39 224 46 250 61C277 78 286 103 289 130L296 162C302 196 285 218 253 225C216 235 175 234 143 224C114 220 93 209 88 187C81 161 86 129 97 104Z" fill="#FFFDFA"/>
    <!-- Orelhas pretas, largas e caídas. -->
    <path d="M139 58C131 43 116 39 100 47C80 58 61 79 45 95C30 110 30 128 41 141C52 155 67 156 82 148C102 137 106 116 113 97C120 76 126 64 139 58Z" fill="#111110"/>
    <path d="M247 66C263 47 280 53 295 66C311 80 326 101 337 123C348 145 340 165 325 172C308 181 290 169 282 150C273 130 276 110 265 88C260 78 255 71 247 66Z" fill="#111110"/>
    <!-- Visage. -->
    <ellipse cx="226" cy="130" rx="8" ry="10" fill="#111110" stroke="none"/>
    <path d="M166 166C179 152 203 153 221 162C236 170 242 188 233 200C221 216 193 217 174 207C157 199 152 180 166 166Z" fill="#111110" stroke="none"/>
    <ellipse cx="196" cy="174" rx="10" ry="7" fill="#FFFDFA" stroke="none"/>
    <!-- Médaille devant la coleira. -->
    <circle cx="190" cy="245" r="14" fill="#EF91AE" stroke-width="6"/>
    <!-- Patinhas dianteiras: curvas contínuas e dedinhos redondos. -->
    <path d="M155 309C158 329 153 349 140 358C130 365 118 365 110 358C101 351 104 335 108 325" fill="#FFFDFA"/>
    <path d="M124 350C122 355 123 361 125 364" stroke-width="6.5"/>
    <path d="M194 316C188 330 189 349 199 359C207 366 226 367 238 359C249 351 253 333 251 315" fill="#FFFDFA"/>
    <path d="M215 351C213 356 214 361 215 365" stroke-width="6.5"/>
    <!-- Lupa na frente do olho e cabo atrás da patinha. -->
    <path d="M112 185L85 246" stroke-width="14"/>
    <path d="M134 98C158 98 178 116 178 141C178 165 159 184 136 185C111 187 91 168 91 144C90 119 108 99 134 98Z" fill="#FFFDFA"/>
    <ellipse cx="137" cy="139" rx="12" ry="15" fill="#111110" stroke="none"/>
    <ellipse cx="141" cy="134" rx="3.4" ry="4.2" fill="#FFFDFA" stroke="none"/>
    <!-- Patinha que envolve o cabo, sem pontas ou quinas. -->
    <path d="M104 240C98 231 91 228 83 231C72 234 69 244 73 255C76 264 87 270 98 266C110 262 115 254 111 246C109 243 107 241 104 240Z" fill="#FFFDFA" stroke-width="7"/>
    <path d="M79 250C83 255 88 257 93 256" stroke-width="5"/>
  </g>
  <g stroke="#EF91AE" stroke-width="7" stroke-linecap="round">
    <path d="M346 205L355 190M357 220L373 212"/>
