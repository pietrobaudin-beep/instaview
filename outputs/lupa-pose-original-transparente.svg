  <!-- Focinho, copiado do primeiro SVG e ajustado à perspectiva. -->
  <g id="reference-nose" transform="translate(90 60) scale(.28)" stroke="none"><path d="M349.68,298.79c-28.28,27.71-84.95,25.67-119.76,12.5-22.91-8.67-43.53-25.64-48.31-50.65s9.22-46.03,29.28-58.96c16.78-10.82,36.15-15.71,56.21-15.12,21.76.64,46.72,5.19,65.66,15.83,13.5,7.58,23.99,18.66,29.7,33.07,8.64,21.83,4.09,46.8-12.77,63.32ZM291.92,250.08c3.98-2.2,6.42-6.31,6.8-10.26.42-4.32-1.44-8.36-4.71-11.27-7.47-6.64-23.21-8.31-32.22-3.13-5.13,2.95-8.22,8.48-6.77,14.31,3.42,13.77,24.04,17.45,36.9,10.34Z" fill="#121010"/><path d="M291.92,250.08c-12.86,7.11-33.47,3.43-36.9-10.34-1.45-5.84,1.64-11.37,6.77-14.31,9.01-5.18,24.75-3.52,32.22,3.13,3.27,2.91,5.13,6.95,4.71,11.27-.39,3.95-2.83,8.06-6.8,10.26Z" fill="#FBF9F4"/></g>
  <path d="M147 151C133 153 121 150 110 145"/>
