  <path d="M82 124L66 149" stroke-width="13"/>
  <path d="M101 57C80 56 64 72 65 94C65 113 80 131 102 131C124 132 139 116 139 96C140 76 123 57 101 57Z" fill="#FBF9F4" stroke-width="6.5"/>
  <ellipse cx="102" cy="94" rx="11.8" ry="13.2" fill="#121010" stroke="none"/>
  <!-- Patinha segurando a lupa: almofada redonda e detalhe curvo. -->
  <path d="M47 138C54 133 62 134 68 139C74 144 76 153 72 159C67 170 57 173 49 168C41 166 36 161 35 156" fill="#FBF9F4"/>
  <path d="M59 159C59 163 62 166 65 165" stroke-width="3.7"/>
</g>
