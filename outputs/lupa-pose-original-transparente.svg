<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 242 218" fill="none">
<title>Cachorrinho com lupa — pose lateral original</title>
<desc>Pose lateral abaixada com a lupa, patas arredondadas, coleira rosa e as cores do SVG de referência.</desc>

<g transform="translate(18 19)" stroke="#121010" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Cauda erguida à esquerda, como no SVG da pose. -->
  <path d="M28 63C10 56 1 39 6 22C9 11 16 4 25 3C21 16 21 29 29 39C32 43 36 46 40 48Z" fill="#FBF9F4"/>
  <!-- Silhueta lateral abaixada. -->
  <path d="M19 94C20 65 39 42 69 34C89 29 109 32 130 43C139 43 148 45 155 50C178 51 179 79 186 97C190 104 192 113 191 121C202 135 190 151 171 151L132 155C138 168 128 176 118 177C105 179 98 173 93 167C78 174 58 172 40 171C35 176 28 179 19 177C6 175 1 169 2 153C3 130 10 109 19 94Z" fill="#FBF9F4"/>
  <!-- Orelha preta caída, integrada à mesma cabeça inclinada. -->
  <path d="M149 46C160 39 178 51 189 63C197 72 203 84 197 91C194 96 185 96 180 91C174 85 174 74 168 64C163 54 157 49 149 46Z" fill="#121010"/>
